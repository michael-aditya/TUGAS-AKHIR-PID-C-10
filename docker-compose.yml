services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cnc-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./src/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health/check -m ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: cnc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: cnc-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  simulator:
    build:
      context: ./src
      dockerfile: simulator/Dockerfile
    container_name: cnc-simulator
    depends_on:
      mosquitto:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/}
      MONGO_DB: ${MONGO_DB:-cnc_raw}
      MQTT_BROKER: ${MQTT_BROKER:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-7}
      BACKFILL_INTERVAL_SECONDS: ${BACKFILL_INTERVAL_SECONDS:-300}
      LIVE_INTERVAL_SECONDS: ${LIVE_INTERVAL_SECONDS:-1.0}
      SIMULATOR_SEED: ${SIMULATOR_SEED:-42}
      FAULT_RATE_MISSING: ${FAULT_RATE_MISSING:-0.015}
      FAULT_RATE_DUPLICATE: ${FAULT_RATE_DUPLICATE:-0.015}
      FAULT_RATE_OUT_OF_RANGE: ${FAULT_RATE_OUT_OF_RANGE:-0.015}
      FAULT_RATE_STUCK_SENSOR: ${FAULT_RATE_STUCK_SENSOR:-0.005}
      FAULT_RATE_INCONSISTENT_FORMAT: ${FAULT_RATE_INCONSISTENT_FORMAT:-0.020}
      FAULT_RATE_LATE_EVENT: ${FAULT_RATE_LATE_EVENT:-0.015}
    restart: unless-stopped

  bridge:
    build:
      context: ./src
      dockerfile: bridge/Dockerfile
    container_name: cnc-bridge
    depends_on:
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-cnc.telemetry.raw}
      MQTT_BROKER: ${MQTT_BROKER:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-sensors/cnc/+/+}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/}
      MONGO_DB: ${MONGO_DB:-cnc_raw}
    restart: unless-stopped

  spark-streaming:
    build:
      context: ./src
      dockerfile: spark/Dockerfile
    container_name: cnc-spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-cnc.telemetry.raw}
      POSTGRES_DSN: ${POSTGRES_DSN:-}
      SPARK_OUTPUT_DIR: /app/data/streaming
      SPARK_CHECKPOINT_DIR: /app/data/checkpoints
    volumes:
      - spark_data:/app/data
    restart: unless-stopped

volumes:
  kafka_data:
  mongo_data:
  spark_data:
